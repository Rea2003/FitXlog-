<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Log | FitXLog</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body onload="loadEntries('goals')">

    <div class="container-fluid">
        <section class="row" style="height: 100vh;">
            
            <!-- Sidebar -->
            <div class="col-md-2 bg-dark text-white pt-3 sidebar">
                <div class="sticky-top">
                    <nav class="navbar bg-dark border-bottom border-white">
                        <div class="container-md">
                            <a class="navbar-brand text-white" href="#">FitXLog</a>
                        </div>
                    </nav>

                    <nav class="nav flex-column mt-3 p-3">
                        <a class="nav-link text-white  hover-zoom mt-1" href="Workoutlog.html"><i class="bi bi-bicycle me-2"></i>Workout Log</a>
                        <a class="nav-link text-white  hover-zoom  mt-1" href="statistics.html"><i class="bi bi-speedometer2 me-2"></i>Statistics</a>
                        <a class="nav-link text-white  hover-zoom mt-1" href="goals.html"><i class="bi bi-alarm me-2"></i>Goals</a>
                        <a class="nav-link text-white  hover-zoom mt-1" href="profile.html"><i class="bi bi-person me-2"></i>Profile</a>
                    </nav>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-0">
                
                <!-- Navbar -->
                <nav class="navbar navbar-expand-lg bg-light shadow-sm">
                    <div class="container-fluid justify-content-end">
                        <a href="index.html" class="btn btn-primary me-2">Home</a>
                        <a href="features.html" class="btn btn-outline-primary me-2">Features</a>
                        <a href="about.html" class="btn btn-outline-primary">About Us</a>
                    </div>
                </nav>

                <!-- goals Log Section -->
                <div class="container mt-4 p-5">
                    <h2 class="text-center">Set Your Fitness Goals</h2>
                    <div class="card p-4 mt-3">
                        <h4>New Goal</h4>
                        <form id="goal-form">
                            <div class="mb-3">
                                <label class="form-label">Goal Type</label>
                                <select id="goalType" class="form-select">
                                    <option>Run X miles</option>
                                    <option>Burn X calories</option>
                                    <option>Train X days</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Target Value</label>
                                <input type="number" id="goalTarget" class="form-control" required>
                            </div>
                            <button type="button" class="btn btn-success w-100" onclick='logging("goals")'>Set Goal</button>
                        </form>
                    </div>

                    <!-- goals History -->
                    <section class="mt-4 pt-3">
                        <h4>Goals History</h4>
                        <ul id="goals-list" class="list-group"></ul>
                    </section>
                    <div class="mt-5" onload=" ">
                        <h4>Prograss</h4>
                    </div>
                    <div class="progress mt-4 pt-1">
                      
                        <div class="progress-bar" role="progressbar" style="width: 25%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">25%</div>
                      </div>
                </div>
            </div>  
        </section>   
        
    </div>

    <!-- Bootstrap & JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="workout_app.js"></script>
</body>
</html>
